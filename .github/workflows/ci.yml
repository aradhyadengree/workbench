# Builds the Swift package and the signed .app bundle on every push and pull request.
# Actions are pinned to full commit SHAs (tag in the trailing comment) so a moved tag
# can't change what runs here. Bump deliberately, after the release has aged a week.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 defaults to Xcode 26.6, the toolchain Workbench is developed against.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build-app.sh uses the commit count as CFBundleVersion
          persist-credentials: false
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Check
        run: ./scripts/check.sh
