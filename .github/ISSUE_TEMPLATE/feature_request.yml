name: Feature request
description: Suggest an idea for Workbench
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The testing workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
